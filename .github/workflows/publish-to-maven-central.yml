name: Publish module to mavenCentral

on:
    workflow_dispatch:
        inputs:
            module:
                description: 'Module to publish'
                required: true
                type: choice
                options:
                    - mvi-core
                    - mvi-annotation
                    - mvi-android
                    - mvi-annotation-processor

jobs:
    publish-to-maven-central:
        name: Publish ${{ inputs.module }}
        runs-on: macOS-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'zulu'
                  java-version: 21

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3

            - name: Assemble module
              run: ./gradlew :${{ inputs.module }}:assemble

            - name: Publish module to MavenCentral
              run: ./gradlew :${{ inputs.module }}:publishToMavenCentral --no-configuration-cache
              env:
                  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
